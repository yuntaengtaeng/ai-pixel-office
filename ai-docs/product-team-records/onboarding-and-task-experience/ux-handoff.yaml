type: ux-handoff
revision: 1
status: draft
title: "온보딩과 Task 경험 개선 프로그램"

scope:
  included:
    - "앱 시작 중 readiness 확인과 Pet 출근 메타포 기반 splash"
    - "미준비 사용자를 위한 전체 화면 단계형 onboarding과 직접 구성 escape hatch"
    - "승인 요청의 목적·영향·기술 상세 정보 계층"
    - "취소·승인 거절을 포함하는 실행 결과와 복구 흐름"
    - "Agent 권한을 범용적인 업무 결과 중심 작업 모드로 설명"
    - "Task 결과의 변경·검증 요약"
    - "Task 상세과 Chat에서 이어지는 단일 Task 타임라인"
    - "이미지 붙여넣기, 파일 선택·드롭, 링크 입력을 포함하는 참고 자료 경험"
    - "모델·reasoning effort·Skill·Workflow의 결과 중심 설명"
  deferred:
    - "비용·자원 가시성: runtime별로 신뢰할 수 있는 사용량과 비용 데이터를 제공할 수 있는지 조사한 뒤 범위를 결정한다."
  excluded:
    - "splash와 onboarding의 시각 스타일, sprite, motion curve와 화면 컴포넌트 구현"
    - "작업 모드와 runtime permission 사이의 기술 매핑"
    - "첨부 파일 저장·복사·접근 권한의 기술 아키텍처"

evidence:
  simulated_findings:
    source: "ai-docs/usability-records/full-journey-2026-09-08.md"
    caveat: "실제 사용자 조사가 아니라 코드 조사 기반 시뮬레이션이며 발생률로 해석하지 않는다."
    findings:
      - "필수 준비 단계가 Task 진입점보다 늦게 발견되어 첫 실행에서 헛걸음이 발생한다."
      - "승인 요청의 기술 원문은 숙련 사용자에게 감사 근거이지만, 목적과 영향 설명이 없으면 비기술 사용자는 판단하기 어렵다."
      - "요청·참고 자료·결과가 한 작업의 연속으로 느껴지지 않고, 변경 요약이 부족하다."
      - "취소·거절도 재현 가능한 결과로 보여야 한다."
      - "모델, effort, Skill과 권한의 기술 용어가 사용자가 기대할 결과를 설명하지 못한다."
  canonical_decisions:
    - source: "ai-docs/adr/009-ui-ux-information-architecture.md"
      relation: "최초 실행 흐름, 공통 Composer, 상태별 대표 행동, Empty State와 접근성 계약을 확장한다."
    - source: "ai-docs/adr/010-ui-ux-improvement-log.md"
      relation: "보류된 전용 Onboarding Page를 구체화하고, 이미 적용된 Task 세션 메시지 흐름을 보존한다."
  verified_current_behavior:
    - id: current-startup
      status: existing
      fact: "앱은 workspace를 불러오거나 생성하는 동안 전체 화면에 '오피스 문을 여는 중...'만 표시하고, 완료되면 readiness 분기 없이 앱 shell과 Today로 진입한다."
      source: "apps/web/src/App.tsx"
    - id: current-runtime-status
      status: existing_partial
      fact: "Settings에는 Codex·Claude 설치 및 인증 상태, 설치·로그인 행동과 직접 실행할 터미널 명령이 있다. 이 경험은 시작 흐름에 통합되어 있지 않다."
      source: "apps/web/src/features/settings/SettingsPage.tsx"
    - id: current-session-thread
      status: existing_partial
      fact: "Task 상세과 Chat은 각각 run을 시간순 메시지로 보여주고 후속 요청을 보낼 수 있지만 별도 route와 별도 표현으로 제공된다."
      source: "apps/web/src/features/tasks/TaskDetailPage.tsx; apps/web/src/features/chat/ChatPage.tsx"
    - id: current-reference-documents
      status: existing_partial
      fact: "Task에는 기존 Knowledge Document를 검색·선택하는 참고 문서 관리가 있으나 로컬 파일·클립보드 이미지·드롭 첨부 경험은 없다."
      source: "apps/web/src/features/tasks/components/context/ReferenceDocumentsDialog.tsx"
    - id: current-cancel-record
      status: existing_partial
      fact: "서버는 취소 run, event log reference와 부분 산출물 보존 activity를 남기지만 실행 기록 UI는 취소 사유·영향·보존 상태를 별도 결과 요약으로 설명하지 않는다."
      source: "apps/server/src/orchestrator.ts; apps/web/src/features/tasks/components/results/RunHistory.tsx"
    - id: current-approval
      status: existing_partial
      fact: "승인 요청은 reason이 있으면 표시하고 command 원문과 이번만 승인·거절 행동을 제공한다. reason이 없으면 일반 문구로 대체하며 영향 범위와 거절 후 상태는 설명하지 않는다."
      source: "apps/web/src/features/tasks/components/execution/RuntimeApproval.tsx"
    - id: current-agent-settings
      status: existing_partial
      fact: "Agent는 모델, reasoning effort와 개별 permission을 설정한다. fileRead와 terminal은 runtime 필수이며 새 Agent는 fileWrite까지 기본 활성화된다."
      source: "apps/web/src/features/agents/components/AgentAdvancedOptions.tsx; apps/web/src/features/agents/hooks/useAgentForm.ts"

problem: >-
  신규 또는 설정이 불완전한 사용자는 앱이 실제 작업을 시작할 준비가 되었는지 알기 전에 대시보드와
  Task 진입점을 만나며, 실행 전에는 승인과 권한의 의미를, 실행 후에는 변경·취소·거절의 결과를
  업무 언어로 판단하기 어렵다. Task 상세과 Chat, 참고 자료와 결과도 하나의 지속되는 작업 맥락으로
  충분히 연결되지 않는다.

user_goal: >-
  사용자는 앱을 열면 준비 확인이 진행 중임을 이해하고, 필요한 설정만 순서대로 완료하거나 직접 구성으로
  건너뛴 뒤, 한 Task 안에서 참고 자료를 붙여 요청하고 승인·취소·결과·후속 요청의 전체 이력을 이해 가능한
  언어와 필요할 때의 기술 근거로 확인할 수 있다.

principles:
  - "splash는 readiness 확인에 필요한 대기를 설명하며, 시간을 인위적으로 늘리지 않는다."
  - "Pet 출근 표현은 브랜드 맥락이고 readiness의 실제 상태·오류·다음 행동을 대체하지 않는다."
  - "onboarding은 기존 기능의 축소판이 아니라 같은 입력·검증·저장 결과를 단계별 문맥으로 제공한다."
  - "직접 구성 escape hatch는 언제든 명확히 찾을 수 있고, 사용자가 입력한 내용을 버리지 않는다."
  - "업무 언어를 먼저 보여주고 감사·디버깅에 필요한 원문은 숨기지 않은 채 두 번째 계층에 둔다."
  - "Task와 Chat은 진입점이 달라도 동일한 Task의 동일한 사건 순서와 맥락을 공유한다."
  - "기존 사용자와 이미 준비된 사용자는 onboarding을 반복하지 않는다."

readiness_model:
  purpose: "splash 이후 dashboard 또는 onboarding으로 일관되게 분기하기 위한 사용자 관찰 가능 상태"
  candidate_required_conditions:
    - "지원 runtime 중 하나가 설치되고 인증되어 있다."
    - "해당 runtime으로 실행 가능한 Agent가 하나 이상 있다."
  contextual_condition:
    - "로컬 파일을 다루는 첫 작업에는 연결된 작업 폴더가 필요하지만 일반 대화 Task에는 프로젝트가 없어도 실행 가능하다는 현재 계약을 보존한다."
  non_condition:
    - "Task가 이미 존재하는지는 앱 실행 readiness 조건이 아니다."
  decision_needed: "필수 조건의 정확한 서버 계약과 여러 runtime 중 부분 준비 상태는 Product/Developer 확인이 필요하다."

primary_flow:
  - id: launch-check
    actor_action: "사용자가 앱을 실행한다."
    system_response: "앱은 Pet들이 출근하는 맥락의 splash와 함께 workspace 및 readiness 확인 진행 상태를 텍스트로 알린다."
    completion: "필수 확인이 성공·실패·시간 초과 중 하나로 종료된다."
  - id: ready-branch
    precondition: "필수 readiness 조건이 충족됨"
    actor_action: "추가 입력 없음"
    system_response: "splash를 종료하고 dashboard로 진입한다."
    completion: "사용자가 현재 업무 상태와 새 Task 진입점을 사용할 수 있다."
  - id: onboarding-branch
    precondition: "필수 readiness 조건 중 하나 이상이 충족되지 않음"
    actor_action: "사용자가 전체 화면 onboarding에서 현재 미완료 단계와 전체 진행 순서를 확인한다."
    system_response: "이미 완료된 단계는 완료로 표시하고 첫 미완료 단계로 이동한다."
    completion: "사용자가 현재 단계의 목적과 필요한 입력, 예상 결과를 이해한다."
  - id: runtime-step
    actor_action: "사용자가 사용할 AI를 선택하고 기존 설치·로그인 흐름을 완료한 뒤 다음을 누른다."
    system_response: "실제 연결 상태를 다시 확인하고 성공했을 때만 저장된 선택과 완료 상태를 반영한다."
    completion: "지원 runtime 하나 이상이 실행 가능하거나, 실패 이유와 재시도·직접 구성 선택지가 보인다."
  - id: colleague-step
    actor_action: "사용자가 AI 동료의 이름, 맡길 일과 작업 방식을 입력·선택하고 다음을 누른다."
    system_response: "기존 Agent 생성 계약으로 저장한 뒤 생성된 동료와 적용된 작업 범위를 요약한다."
    completion: "실행 가능한 Agent가 하나 이상 존재한다."
  - id: workspace-step
    actor_action: "사용자가 로컬 자료를 다룰 예정이면 작업 폴더를 연결하고, 일반 대화만 시작할 수 있으면 해당 선택의 차이를 확인한다."
    system_response: "기존 Project 생성·폴더 선택 계약으로 저장하고 접근 범위를 요약한다."
    completion: "프로젝트가 생성되거나 사용자가 현재 지원되는 경우에 한해 '지금은 일반 작업으로 시작'을 명시적으로 선택한다."
  - id: onboarding-complete
    actor_action: "사용자가 완료 요약에서 대시보드로 이동한다."
    system_response: "완료한 설정을 다시 생성하지 않고 dashboard와 실행 가능한 첫 Task 행동을 제공한다."
    completion: "첫 Task 버튼은 현재 선택 가능한 Agent와 작업 범위를 사용하며 불가능하면 원인과 해결 위치를 함께 보여준다."
  - id: direct-configure
    actor_action: "사용자가 하단의 '제가 직접 구성할래요'를 선택한다."
    system_response: "건너뛰는 결과와 아직 실행할 수 없는 기능을 짧게 알리고, 확인 후 dashboard 또는 기존 설정 화면으로 이동한다."
    completion: "입력·생성 완료 데이터는 유지되고 미완료 단계만 남으며, 이후 Task 진입점에서 readiness 원인과 해결 행동을 확인할 수 있다."
  - id: compose-with-context
    actor_action: "사용자가 Task 또는 Chat composer에 텍스트를 입력하고 이미지 붙여넣기, 파일 선택·드롭 또는 링크 입력으로 참고 자료를 추가한다."
    system_response: "각 자료의 이름·형식·처리 상태·제거 행동과 이번 요청에 포함되는 범위를 전송 전에 보여준다."
    completion: "요청과 사용된 참고 자료가 같은 Task의 첫 사용자 사건으로 기록된다."
  - id: approval-decision
    actor_action: "사용자가 실행 중 발생한 승인 요청에서 목적, 영향 범위와 기술 상세를 확인하고 계속 또는 거절을 선택한다."
    system_response: "결정 처리 중 중복 입력을 막고, 처리 결과와 이후 Task 상태를 타임라인에 기록한다."
    completion: "승인 시 같은 실행이 계속되고, 거절 시 해당 실행 결과와 가능한 다음 행동이 남는다."
  - id: review-and-continue
    actor_action: "사용자가 결과 요약에서 수행 내용, 변경 대상, 검증 결과, 미완료·위험을 확인하고 같은 composer로 후속 요청을 보낸다."
    system_response: "요청, 승인, 진행, 결과, 취소·거절과 후속 요청을 단일 시간순 타임라인에 추가한다."
    completion: "Task 상세 또는 Chat 어느 진입점에서도 동일한 사건과 참고 자료 관계를 확인한다."

work_modes:
  intent: "코드·terminal 중심 permission 이름보다 사용자가 맡기려는 결과와 영향 범위를 먼저 설명한다."
  candidate_labels:
    - id: discuss
      working_label: "대화하고 정리하기"
      outcome: "아이디어, 문서 내용이나 계획을 읽고 답변·요약·초안을 만든다."
      impact_summary: "사용자의 자료를 바꾸지 않는 것을 기본 기대값으로 설명한다."
    - id: inspect
      working_label: "자료를 살펴보고 제안하기"
      outcome: "연결한 자료와 작업 폴더를 조사해 문제, 선택지와 개선안을 제안한다."
      impact_summary: "조사 범위와 외부 접근 가능성을 실행 전에 확인하게 한다."
    - id: change
      working_label: "자료를 만들고 변경하기"
      outcome: "파일이나 프로젝트에 결과를 만들거나 수정하고 필요한 검증을 수행한다."
      impact_summary: "변경 가능한 범위와 추가 승인이 필요한 행동을 설명한다."
  constraint: "이름과 개수는 사용자 언어 검증 전 working label이며, 실제 permission을 과장하거나 지원하지 않는 안전 보장을 약속해서는 안 된다."
  advanced_access: "개별 파일 읽기·쓰기, 명령 실행, 브라우저 등 기술 permission은 고급 설정에서 확인·조정 가능한 근거로 유지한다."

approval_information_hierarchy:
  level_1_decision_summary:
    contains:
      - "왜 지금 필요한지"
      - "승인하면 실행이 어떻게 계속되는지"
      - "거절하면 이번 실행이 어떻게 되는지"
  level_2_impact:
    contains:
      - "읽기, 생성, 수정, 삭제, 명령 실행, 외부 통신 등 영향 유형"
      - "영향 대상 또는 작업 범위"
      - "일회 승인인지 더 긴 범위인지"
      - "되돌릴 수 있는지 또는 확인 불가인지"
  level_3_technical_evidence:
    contains:
      - "원시 명령 또는 runtime 제공 상세"
      - "작업 폴더"
      - "요청 ID·실행 ID와 상세 로그 접근"
    default: "필요할 때 펼칠 수 있으나 정보가 없다는 사실도 명시한다."

result_summary_contract:
  applies_to: "코드뿐 아니라 문서, 디자인 자료, 조사와 일반 작업 결과"
  sections:
    - "무엇을 했는지: 사용자의 요청과 연결되는 한눈 요약"
    - "무엇이 달라졌는지: 생성·수정·삭제·제안된 대상의 목록 또는 변경 없음"
    - "어떻게 확인했는지: 실행한 검증, 확인하지 못한 항목과 그 이유"
    - "남은 일과 주의점: 미완료, 실패, 사용자 결정 필요 사항"
    - "근거 보기: diff, 파일, 산출물, 원시 로그 등 runtime이 실제 제공하는 상세"
  cancelled_or_denied:
    - "취소 또는 거절을 terminal result로 명명한다."
    - "누가 어떤 결정을 언제 했는지, 중단 전에 완료된 범위와 부분 결과의 보존 여부를 표시한다."
    - "보존 여부를 확인할 수 없으면 보존됨으로 추정하지 않고 '확인할 수 없음'으로 표시한다."
    - "다시 시도, 요청 수정, 설정 변경 등 실제 가능한 다음 행동을 제공한다."

timeline_contract:
  canonical_unit: "Task session"
  ordered_event_types:
    - "최초 요청과 참고 자료"
    - "Agent·Workflow 실행 시작 및 진행 요약"
    - "승인 요청과 사용자 결정"
    - "성공, 실패, 취소, 거절 결과"
    - "후속 요청과 해당 요청으로 시작한 새 run"
  navigation_rule: "Task 상세과 /chat/:taskId는 서로 다른 Task 복제본을 만들지 않고 같은 session을 연다. 사용자가 화면을 바꿔도 마지막 읽은 위치와 작성 중 입력을 가능한 범위에서 보존한다."
  presentation_rule: "두 진입점의 주변 목적은 달라도 사건 명칭, 순서, 참고 자료, 승인 결정과 결과 내용은 일치해야 한다. route 통합 여부는 UI·Developer가 결정한다."

attachment_contract:
  supported_intents:
    - "클립보드에서 이미지 붙여넣기"
    - "파일 선택"
    - "파일 드롭"
    - "웹 링크를 참고 자료로 추가"
  before_send:
    - "자료별 이름·종류·처리 상태를 보여준다."
    - "사용자가 개별 자료를 제거하거나 실패한 자료만 다시 시도할 수 있다."
    - "붙여넣은 이미지에는 구분 가능한 기본 이름과 미리보기를 제공한다."
    - "지원하지 않는 형식·크기·접근 불가 항목은 전송 전에 이유와 해결 방법을 표시한다."
  after_send:
    - "어떤 요청과 실행에 어떤 버전의 자료가 사용되었는지 타임라인에서 확인한다."
    - "후속 요청에서 기존 자료의 재사용 여부를 사용자가 알 수 있고 변경할 수 있다."
    - "로컬 자료가 어디까지 전달·복사·보존되는지 사용자가 첨부 전에 확인한다."

expert_setting_explanations:
  model: "어떤 AI를 사용하는지와 연결 가능 상태, 해당 선택이 결과·기능에 주는 확인된 차이를 설명한다."
  reasoning_effort: "더 빠른 응답과 더 깊은 검토 사이의 경향, 시간·사용량 증가 가능성을 정성적으로 설명하고 보장된 품질 차이처럼 표현하지 않는다."
  skill: "이 동료가 특정 종류의 일을 수행할 때 따를 작업 방법과 필요한 접근 범위를 설명한다."
  workflow: "한 Task를 여러 동료 또는 단계가 어떤 순서로 수행·검토하는지 설명한다."

states:
  - id: splash-checking
    visible_information: "앱을 준비 중이라는 실제 상태와 현재 확인 항목"
    available_actions: "없음; 확인이 비정상적으로 길어지면 상태 설명과 재시도 또는 진단 이동 제공"
    transition: "ready이면 dashboard, not-ready이면 onboarding, failure이면 splash-error"
  - id: splash-reduced-motion
    visible_information: "동일한 readiness 텍스트와 정적인 Pet 출근 장면"
    available_actions: "splash-checking과 동일"
    transition: "사용자 motion 환경 설정을 존중하며 기능 흐름은 동일"
  - id: splash-error
    visible_information: "확인하지 못한 항목, 이미 확인된 항목, 데이터가 삭제되지 않았음"
    available_actions: "다시 확인, 가능한 경우 직접 구성, 오류 상세 보기"
    transition: "재시도 성공 시 readiness 분기; 반복 실패 시 기존 설정 접근 가능 여부를 명시"
  - id: onboarding-step-ready
    visible_information: "전체 단계, 현재 단계 목적, 기존 값, 완료 조건"
    available_actions: "입력, 다음, 이전, 직접 구성"
    transition: "다음은 저장 성공 후에만 다음 단계로 이동"
  - id: onboarding-saving
    visible_information: "현재 항목을 생성·연결 중임"
    available_actions: "중복 제출 불가; 안전하게 취소 가능한지는 동작별로 표시"
    transition: "성공 시 step-complete, 실패 시 onboarding-save-error"
  - id: onboarding-save-error
    visible_information: "저장·설치·로그인 실패 원인과 유지된 입력"
    available_actions: "재시도, 입력 수정, 이전, 직접 구성"
    transition: "성공할 때까지 현재 단계 유지"
  - id: onboarding-step-complete
    visible_information: "생성·연결된 항목과 이제 가능한 일"
    available_actions: "다음 단계, 필요하면 방금 설정 수정"
    transition: "다음 미완료 단계 또는 onboarding-complete"
  - id: onboarding-return
    visible_information: "이전 완료 단계와 첫 미완료 단계"
    available_actions: "이어서 하기, 직접 구성"
    transition: "완료 데이터를 중복 생성하지 않고 첫 미완료 단계로 이동"
  - id: dashboard-not-ready-after-skip
    visible_information: "현재 가능한 일과 실행을 막는 미완료 조건"
    available_actions: "해당 설정으로 직접 이동, 실행 불필요 기능 계속 사용, onboarding 다시 열기"
    transition: "설정 완료 후 원래 작성 맥락으로 복귀"
  - id: attachment-processing
    visible_information: "자료별 처리 중 상태와 아직 요청에 포함되지 않았음"
    available_actions: "개별 제거, 처리 취소 가능 시 취소"
    transition: "성공 시 ready, 실패 시 attachment-error"
  - id: attachment-ready
    visible_information: "전송될 자료와 요청 연결 범위"
    available_actions: "미리보기, 제거, 추가, 요청 전송"
    transition: "전송 후 Task timeline 사건으로 고정"
  - id: attachment-error
    visible_information: "실패한 자료와 이유, 성공한 다른 자료는 유지됨"
    available_actions: "개별 재시도, 제거, 지원되는 방식 안내"
    transition: "실패 자료가 남아 있으면 포함되지 않음을 전송 전에 명시"
  - id: approval-waiting
    visible_information: "3단 정보 계층, 결정을 기다리는 Task, 요청 시점"
    available_actions: "허용하고 계속, 허용하지 않기, 기술 상세 보기"
    transition: "결정 처리 중 상태로 이동"
  - id: approval-resolving
    visible_information: "선택한 결정과 처리 중 상태"
    available_actions: "중복 결정 불가"
    transition: "승인 시 running, 거절 시 denied-result; 실패 시 원래 요청과 오류 보존"
  - id: denied-result
    visible_information: "거절된 요청, 영향받지 않은 범위, 중단·계속 여부와 다음 행동"
    available_actions: "요청 수정, 설정 검토, 실제 지원 시 재시도"
    transition: "새 행동은 이전 결정을 덮지 않고 새 timeline 사건 생성"
  - id: cancellation-result
    visible_information: "취소 시점, 취소 주체, 완료 범위, 부분 결과와 보존 상태"
    available_actions: "부분 결과 보기, 새 실행으로 다시 시도, 요청 수정"
    transition: "다시 시도는 새 run임을 명확히 표시"
  - id: result-complete
    visible_information: "결과 요약 계약의 모든 확인 가능한 항목"
    available_actions: "근거 보기, 후속 요청, 실제 지원 시 산출물 열기"
    transition: "후속 요청은 동일 Task의 새 사용자 사건과 run 생성"
  - id: result-partial-or-unknown
    visible_information: "확인된 결과와 확인할 수 없는 항목을 분리"
    available_actions: "상세 로그, 검증 요청, 후속 요청"
    transition: "추가 실행 결과를 기존 사실과 구분해 timeline에 추가"

edge_cases:
  - "readiness 확인 도중 일부 query만 실패하면 전체를 준비 완료 또는 미완료로 단정하지 않고 항목별 확인 불가를 표시한다."
  - "Codex와 Claude 중 하나만 준비된 경우 그 runtime을 사용하는 Agent가 실제 실행 가능한지까지 확인하며, 다른 runtime 미준비만으로 onboarding을 강제할지는 정책 결정이 필요하다."
  - "기존 사용자에게 Task와 Agent가 있지만 인증이 만료되면 데이터를 숨기지 않고 재연결 단계와 dashboard 접근 정책을 설명한다."
  - "onboarding 도중 앱을 종료하거나 로그인 외부 창을 취소해도 완료된 생성물과 작성 중 입력의 보존 범위를 안내하고 재진입 시 이어간다."
  - "다음 버튼을 반복 입력해도 Agent나 Project가 중복 생성되지 않는다."
  - "직접 구성 선택 시 작성 중이지만 저장하지 않은 민감 입력을 임의로 저장하지 않으며, 폐기 여부를 사용자에게 알린다."
  - "작업 폴더가 삭제·이동·접근 거부된 경우 과거 Project 존재만으로 ready라고 표시하지 않는다."
  - "일반 대화 Task와 로컬 파일 변경 Task의 준비 조건을 동일하게 과도하게 제한하지 않는다."
  - "approval reason, command 또는 영향 정보가 runtime에서 누락되면 추측한 설명을 만들지 않고 정보 미제공과 안전한 선택을 표시한다."
  - "승인 요청이 여러 개면 각각 대상·순서·결정 상태를 구분하며 하나의 선택이 다른 요청을 승인한 것처럼 보이지 않는다."
  - "승인 결정과 취소가 동시에 발생하면 서버가 확정한 최종 상태를 한 번만 표시하고 상충한 UI 낙관 상태를 남기지 않는다."
  - "취소·거절 뒤 부분 파일이 존재할 수 있으면 '변경 없음'으로 표현하지 않는다."
  - "과거 run에 결과·request·event snapshot이 없으면 빈 영역 대신 이전 버전 기록이라 상세 확인이 제한됨을 표시한다."
  - "붙여넣은 이미지와 같은 이름의 파일, 중복 파일, 매우 큰 파일, 빈 파일, 지원하지 않는 형식과 손상된 파일을 개별 처리한다."
  - "첨부 처리 중 전송을 시도하면 아직 포함되지 않는 자료를 명확히 알리고 사용자가 기다리거나 제외하도록 한다."
  - "원본 파일이 전송 후 변경되거나 삭제되어도 당시 실행이 참조한 version·snapshot 정책을 오해 없이 표시한다."
  - "Task 상세과 Chat을 동시에 열어 후속 요청하면 중복 전송을 막고 최신 timeline 순서를 동기화한다."
  - "긴 timeline은 최신 사건 접근과 과거 승인·결과 탐색을 모두 지원하고 focus 위치를 잃지 않는다."
  - "keyboard만으로 onboarding, 직접 구성, 첨부, 상세 펼치기, 승인, 후속 요청을 완료할 수 있다."

acceptance_criteria:
  - id: AC-01
    criterion: "앱 시작 시 사용자는 readiness 확인 중임을 텍스트로 알 수 있고, 확인 완료 전 dashboard가 준비된 것처럼 노출되지 않는다."
  - id: AC-02
    criterion: "readiness가 충족된 기존 사용자는 onboarding을 거치지 않고 dashboard에 도달한다."
  - id: AC-03
    criterion: "readiness가 충족되지 않은 사용자는 첫 미완료 단계가 선택된 전체 화면 onboarding을 보고 전체 단계와 완료 상태를 확인한다."
  - id: AC-04
    criterion: "각 onboarding 단계의 다음 행동은 기존 제품과 동일한 유효성 검증과 영속 결과를 만들며, 저장 실패 시 입력을 유지하고 다음 단계로 이동하지 않는다."
  - id: AC-05
    criterion: "완료한 onboarding을 다시 열거나 재시작해도 같은 Agent·Project가 중복 생성되지 않는다."
  - id: AC-06
    criterion: "모든 onboarding 단계에서 '제가 직접 구성할래요'를 찾을 수 있고, 선택 결과와 미완료 조건을 확인한 뒤 기존 구성 화면 또는 dashboard로 이동할 수 있다."
  - id: AC-07
    criterion: "직접 구성 후 미준비 상태에서 Task 시작을 시도하면 막힌 이유와 정확한 해결 행동을 같은 맥락에서 확인하고, 해결 뒤 작성 내용을 복원할 수 있다."
  - id: AC-08
    criterion: "motion 감소 설정에서는 의미 없는 출근 애니메이션이 제거되지만 readiness 상태와 분기 정보는 동일하다."
  - id: AC-09
    criterion: "Agent 생성의 기본 선택 화면은 최소 세 가지 범용 작업 결과와 영향 차이를 설명하며, 기술 permission 이름은 고급 상세에서 계속 확인할 수 있다."
  - id: AC-10
    criterion: "승인 요청은 기술 상세를 열지 않아도 목적, 영향 유형·대상, 승인·거절 결과를 판단할 수 있고 원시 명령과 실행 근거도 별도로 확인할 수 있다."
  - id: AC-11
    criterion: "reason 또는 영향 정보가 제공되지 않은 승인 요청은 이를 일반화해 확정적으로 번역하지 않고 '정보를 확인할 수 없음'을 표시한다."
  - id: AC-12
    criterion: "승인, 거절, 취소 결정은 처리 중 중복 제출되지 않으며 결과가 해당 Task의 시간순 기록에 남는다."
  - id: AC-13
    criterion: "취소·거절 결과에서 사용자는 중단 전 완료 범위, 부분 결과 보존 여부, 결정 주체·시점과 실제 가능한 다음 행동을 확인한다."
  - id: AC-14
    criterion: "완료 결과는 업무 종류와 무관하게 수행 요약, 생성·수정·삭제 또는 변경 없음, 검증 결과, 미완료·주의점과 제공 가능한 근거를 구분한다."
  - id: AC-15
    criterion: "Task 상세과 /chat/:taskId에서 같은 Task를 열면 요청, 참고 자료, 승인 결정, 실행 결과와 후속 요청의 내용과 순서가 일치한다."
  - id: AC-16
    criterion: "사용자가 어느 진입점에서 후속 요청을 보내도 기존 Task에 새 사건과 새 run으로 연결되고 별도의 Task가 암묵적으로 생성되지 않는다."
  - id: AC-17
    criterion: "composer는 이미지 붙여넣기, 파일 선택, 파일 드롭과 링크 추가를 제공하고 전송 전 각 자료의 포함 여부·상태·제거 행동을 보여준다."
  - id: AC-18
    criterion: "첨부 하나가 실패해도 성공한 입력과 다른 첨부는 유지되며 실패 이유, 재시도 또는 제거 방법을 확인한다."
  - id: AC-19
    criterion: "전송 후 사용자는 어느 요청과 run이 어느 참고 자료를 사용했는지 확인하고 후속 요청에서 재사용 여부를 알 수 있다."
  - id: AC-20
    criterion: "모델, reasoning effort, Skill과 Workflow에는 기술 정의와 별개로 예상되는 작업 결과·시간·범위의 차이가 표시되며 확인되지 않은 비용이나 품질을 보장하지 않는다."
  - id: AC-21
    criterion: "onboarding, 첨부, 승인과 timeline의 핵심 흐름은 keyboard만으로 완료되며 상태 변화가 색상이나 motion에만 의존하지 않는다."
  - id: AC-22
    criterion: "비용·자원 수치는 조사와 데이터 계약이 확정되기 전에는 추정값을 제품 사실처럼 표시하지 않는다."

open_questions:
  - id: OQ-01
    owner: "Product Architect / Full-stack Developer"
    question: "dashboard 직행을 허용하는 canonical readiness 조건은 무엇이며, 앱 시작 시 한 번의 응답으로 원자적으로 판정할 수 있는가?"
    impact: "splash 분기, stale 상태와 부분 실패 처리"
  - id: OQ-02
    owner: "Product"
    question: "연결된 프로젝트 폴더를 onboarding 필수 완료 조건으로 볼 것인가, 일반 대화로 먼저 시작하는 선택을 공식 지원할 것인가?"
    impact: "onboarding 단계 수와 완료 정의; 현재 general scope 계약과의 정합성"
  - id: OQ-03
    owner: "Product"
    question: "첫 Task 생성을 onboarding 마지막 단계에 포함할 것인가, 준비 완료 후 dashboard의 첫 성공 행동으로 둘 것인가?"
    impact: "사용자가 제안한 dashboard 분기와 ADR 009의 4단계 체크리스트 사이의 해석"
  - id: OQ-04
    owner: "Product / UI Designer"
    question: "'제가 직접 구성할래요' 선택 직후 dashboard와 기존 Settings 중 어디로 이동시키며, 경고 확인을 어느 수준으로 요구할 것인가?"
    impact: "escape hatch가 또 다른 막다른 길이 되는 위험"
  - id: OQ-05
    owner: "Runtime Integrator / Full-stack Developer"
    question: "각 runtime 승인 event가 목적, 영향 유형·대상, 되돌림 가능성, 명령과 작업 폴더를 어느 수준까지 안정적으로 제공하는가?"
    impact: "3단 정보 계층에서 사실과 추정의 경계"
  - id: OQ-06
    owner: "Product Architect / Security Reviewer"
    question: "범용 작업 모드별 permission 기본값과 추가 승인 정책은 무엇이며, Claude/Codex capability 차이를 어떻게 사용자 기대와 일치시킬 것인가?"
    impact: "안전 보장 과장 및 실행 불가 Agent 생성 위험"
  - id: OQ-07
    owner: "Runtime Integrator"
    question: "코드 외 문서·이미지·조사 작업까지 공통으로 제공 가능한 구조화된 변경 목록과 verification 신호는 무엇인가?"
    impact: "결과 요약의 자동 생성 가능 범위와 '확인 불가' 처리"
  - id: OQ-08
    owner: "Product / UI Designer / Full-stack Developer"
    question: "Task 상세과 Chat을 한 route·화면으로 통합할지, 동일 session model을 공유하는 두 진입 표면으로 유지할지?"
    impact: "navigation, back behavior, draft와 scroll 위치 보존"
  - id: OQ-09
    owner: "Product Architect / Security Reviewer"
    question: "로컬 파일과 붙여넣은 이미지는 원본 경로 참조, 앱 관리 저장소 복사, run snapshot 중 어떤 정책을 사용하며 runtime에는 어떻게 전달되는가?"
    impact: "재현성, 개인정보, 파일 변경·삭제 후 동작과 지원 크기"
  - id: OQ-10
    owner: "Product"
    question: "웹 링크는 단순 URL 텍스트, 실행 시 fetch 대상, snapshot 문서 중 무엇이며 외부 통신 승인을 언제 받는가?"
    impact: "첨부 완료 의미와 보안 기대"
  - id: OQ-11
    owner: "Runtime Integrator / Product"
    question: "Codex와 Claude가 토큰, 비용, 시간, session limit을 어떤 정확도와 단위로 제공하며 사용자에게 비교 가능한가?"
    impact: "비용·자원 가시성의 구현 여부; 조사 완료 전 deferred"
  - id: OQ-12
    owner: "UI Designer"
    question: "Pet 출근 splash의 motion, reduced-motion 대체, 긴 확인과 오류 상태를 기존 pixel visual language 안에서 어떻게 표현할 것인가?"
    impact: "브랜드성과 상태 명료성; UX Handoff는 시각 해법을 결정하지 않음"

