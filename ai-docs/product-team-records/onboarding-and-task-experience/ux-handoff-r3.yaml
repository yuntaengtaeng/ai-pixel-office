type: ux-handoff
revision: 3
status: accepted
supersedes: "ux-handoff-r2.yaml의 onboarding 순서와 완료 조건"
problem: "기술 설정을 먼저 요구하면 사용자는 무엇을 위해 AI, Agent, Project를 정하는지 알기 어렵고 설정 완료가 실제 제품 가치인 첫 업무 실행으로 이어지지 않는다."
user_goal: "가장 먼저 맡길 업무를 설명하고, 그 업무를 수행할 AI와 추천 동료·Pet을 확인한 뒤 필요한 경우에만 Project를 연결해 첫 업무를 시작한다."
primary_flow:
  - id: readiness
    action: "workspace와 실행 가능한 authenticated runtime-Agent 조합을 확인한다."
    outcome: "ready 사용자는 dashboard로 가고 not-ready 사용자만 onboarding을 시작한다."
  - id: intent
    action: "첫 업무를 자연어로 입력한다."
    outcome: "입력은 draft와 이후 첫 Task description으로 보존된다."
  - id: runtime
    action: "실제 업무에 사용할 AI를 연결하고 선택한다."
    outcome: "하나만 연결되면 자동 사용하고, 둘 다 연결되면 사용자가 선택하며 자동 우선순위를 두지 않는다."
  - id: fit-preview
    action: "선택한 AI가 Task나 Agent를 만들지 않고 동료 이름·역할·이유와 dog/cat Pet 후보를 제안한다."
    outcome: "사용자는 제안된 사원증, 역할과 Pet을 수정·선택한다."
  - id: project
    action: "필요하면 Project 폴더, 이름과 선택 목표를 입력하고, 입력하지 않으면 건너뛴다."
    outcome: "생성한 Project는 첫 Task와 최근 Project 선택에 연결된다."
  - id: launch
    action: "첫 업무 시작하기를 선택한다."
    outcome: "Agent, 선택적 Project, Task와 run을 생성하고 기존 Task session으로 이동한다."
states:
  - "workspace-loading / workspace-error / readiness-checking"
  - "intent-empty / intent-ready"
  - "runtime-disconnected / connecting / connected-one / connected-many-unselected / selected"
  - "fit-loading-overlay / fit-success / fit-error-retry"
  - "colleague-editing / pet-selected"
  - "project-empty-skip / folder-selected / invalid"
  - "launching / recoverable-error / task-session"
edge_cases:
  - "두 runtime이 연결되어도 기본 선택하지 않는다."
  - "runtime 인증 취소·실패와 fit 실패에서 intent draft를 유지한다."
  - "fit preview는 Task, Agent, Project와 run history를 생성하지 않는다."
  - "추천 Pet은 잠금 없는 dog 한 마리와 cat 한 마리를 포함하고 능력 우열을 암시하지 않는다."
  - "Project 입력이 없으면 생성하지 않고 첫 Task를 general scope로 시작한다."
  - "부분 성공 재시도에서 현재 화면 세션에 생성된 Agent, Project와 Task ID를 재사용한다."
  - "Task와 run 생성 뒤 실행 실패는 onboarding으로 되돌리지 않고 Task session에서 복구한다."
acceptance_criteria:
  - "첫 질문은 provider가 아니라 실제 첫 업무다."
  - "AI 연결은 상태와 행동이며, 둘 다 연결됐을 때만 실제 실행 AI 선택을 요구한다."
  - "선택한 AI가 동료 fit을 제안하고 같은 runtime이 생성 Agent에 저장된다."
  - "fit 요청 중 기존 작업 대기 표현을 재사용한 card overlay를 표시한다."
  - "동료 화면은 editable 이름·역할, 추천 이유, 사원증과 dog/cat 후보를 제공한다."
  - "Project 화면은 입력이 없으면 건너뛰고 입력이 있으면 description과 recent-project를 저장한다."
  - "완료 시 첫 Task와 run을 만들고 /tasks/:id로 replace navigation한다."
  - "draft와 완료된 entity를 가능한 범위에서 보존하고 색상만으로 상태를 전달하지 않는다."
open_questions:
  - id: OQ-R3-01
    owner: "Runtime Integrator"
    question: "fit preview 실행을 사용자가 취소할 수 있는 HTTP/runtime cancellation 계약이 필요한가?"
  - id: OQ-R3-02
    owner: "Full-stack Developer"
    question: "앱 재시작을 포함한 launch 부분 성공을 멱등하게 복구할 server-side operation key가 필요한가?"
  - id: OQ-05
    owner: "Runtime Integrator / Full-stack Developer"
    question: "각 runtime 승인 event가 목적, 영향 유형·대상, 되돌림 가능성, 명령과 작업 폴더를 어느 수준까지 안정적으로 제공하는가?"
  - id: OQ-06
    owner: "Product Architect / Security Reviewer"
    question: "작업 모드별 permission 기본값과 추가 승인 정책은 무엇이며 Claude/Codex capability 차이를 어떻게 사용자 기대와 일치시킬 것인가?"
  - id: OQ-07
    owner: "Runtime Integrator"
    question: "코드 외 작업까지 공통으로 제공 가능한 구조화된 변경 목록과 verification 신호는 무엇인가?"
  - id: OQ-08
    owner: "Product / UI Designer / Full-stack Developer"
    question: "Task 상세과 Chat을 한 route로 통합할지 동일 session을 공유하는 두 표면으로 유지할지?"
  - id: OQ-09
    owner: "Product Architect / Security Reviewer"
    question: "로컬 파일과 붙여넣은 이미지는 원본 참조, 앱 저장소 복사, run snapshot 중 어떤 정책을 사용하며 runtime에 어떻게 전달하는가?"
  - id: OQ-10
    owner: "Product / Security Reviewer"
    question: "웹 링크는 URL 텍스트, 실행 시 fetch 대상, snapshot 중 무엇이며 외부 통신 승인을 언제 받는가?"
  - id: OQ-11
    owner: "Runtime Integrator / Product"
    question: "Codex와 Claude가 토큰, 비용, 시간, session limit을 어떤 정확도와 단위로 제공하며 비교 가능한가?"
