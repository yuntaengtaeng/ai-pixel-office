    visible_information: "자료별 처리 중·성공·실패와 포함 상태"
    actions: "제거, 실패 항목 재시도"
    next: "ready 자료만 전송 가능; 제외 결과 명시"
  - id: approval-waiting
    visible_information: "승인 3단 정보 계층과 대상 Task"
    actions: "허용하고 계속, 허용하지 않기, 기술 상세"
    next: "approval-resolving"
  - id: approval-resolving
    visible_information: "선택한 결정 처리 중"
    actions: "중복 결정 불가"
    next: "승인 시 running, 거절 시 denied-result, 오류 시 요청 보존"
  - id: denied-result
    visible_information: "거절 내용, 중단 범위, 영향받지 않은 범위와 다음 행동"
    actions: "요청 수정, 설정 검토, 지원되는 재시도"
    next: "새 행동은 기존 결정을 덮지 않고 새 사건 생성"
  - id: cancellation-result
    visible_information: "취소 주체·시점, 완료 범위, 부분 결과 보존 상태"
