    next: "동일 Task에 새 요청과 run 추가"

edge_cases:
  - "workspace 조회 실패는 readiness 미충족이나 onboarding 필요로 표시하지 않는다."
  - "한 runtime만 인증되어도 그 runtime과 호환되는 Agent가 있으면 ready이며 다른 runtime 미인증은 방해하지 않는다."
  - "인증 runtime과 Agent가 각각 존재해도 서로 호환되지 않으면 not-ready다."
  - "기존 인증이 만료되면 데이터는 유지하고 onboarding 재연결 또는 dashboard 직접 구성 경로를 제공한다."
  - "onboarding 재진입은 완료 단계를 중복 생성하지 않고 첫 미완료 단계에서 이어진다."
  - "다음 반복 입력으로 Agent나 Project가 중복 생성되지 않는다."
  - "직접 구성 확인 전에 저장하지 않은 입력의 유지·폐기 결과를 알린다."
  - "Project 없이 일반 대화를 시작한 뒤 파일 작업을 요청하면 draft를 유지한 채 폴더 연결을 해결한다."
  - "연결된 Project 폴더가 이동·삭제·접근 거부되면 파일 작업 진입에서 다시 해결을 요구한다."
  - "승인 purpose, command 또는 영향 정보가 없으면 추측한 번역을 만들지 않는다."
  - "여러 승인 요청은 대상과 결정 상태를 구분하며 한 결정이 다른 요청에 적용된 것처럼 보이지 않는다."
  - "승인과 취소가 경쟁하면 서버가 확정한 terminal 상태를 한 번만 표시한다."
  - "취소·거절 뒤 부분 파일 가능성이 있으면 변경 없음으로 표현하지 않는다."
  - "과거 run snapshot이 없으면 이전 버전 기록이라 상세가 제한됨을 표시한다."
  - "중복·대용량·빈 파일, 손상·미지원 형식과 접근 불가 첨부를 항목별 처리한다."
  - "첨부 처리 중 전송 시 포함되지 않을 항목을 알려 기다리기 또는 제외를 선택하게 한다."
  - "동일 Task를 여러 표면에서 열어도 후속 요청 중복 전송과 timeline 순서 충돌을 방지한다."
  - "keyboard만으로 onboarding, 직접 구성, inline 해결, 첨부, 승인과 후속 요청을 완료한다."

acceptance_criteria:
  - id: AC-01
    criterion: "workspace 조회 중, 조회 오류, readiness 확인 중 상태가 서로 구분되며 workspace 조회 오류는 onboarding으로 전환되지 않는다."
  - id: AC-02
    criterion: "인증된 runtime과 그 runtime으로 실행 가능한 Agent 한 쌍이 있으면 Project와 Task 유무에 관계없이 dashboard로 직행한다."
  - id: AC-03
    criterion: "호환되는 runtime-Agent 쌍이 없으면 전체 화면 onboarding의 첫 미완료 단계로 이동한다."
  - id: AC-04
    criterion: "onboarding 저장 실패 시 입력을 유지하고 이동하지 않으며, 재시작해도 완료 Agent·Project를 중복 생성하지 않는다."
  - id: AC-05
    criterion: "Project 단계는 작업 폴더 연결과 '지금은 대화부터 시작'을 제공하고 두 경로 모두 onboarding을 완료할 수 있다."
  - id: AC-06
    criterion: "onboarding 완료는 Task를 생성하지 않으며 dashboard에서 첫 Task가 별도 첫 성공 행동으로 제시된다."
  - id: AC-07
    criterion: "'제가 직접 구성할래요' 확인 후 dashboard로 이동하고 onboarding 재개 진입점을 확인할 수 있다."
  - id: AC-08
    criterion: "직접 구성 뒤 미완료 조건은 관련 Task 진입점에서 이유와 inline 해결 행동으로 표시되고 해결 뒤 draft가 복원된다."
  - id: AC-09
    criterion: "Project 없는 일반 대화는 시작 가능하고 로컬 자료·파일 작업에만 Project 연결 필요가 표시된다."
  - id: AC-10
    criterion: "reduced motion 환경에서도 readiness 텍스트와 분기 정보가 동일하며 불필요한 출근 motion은 제거된다."
  - id: AC-11
    criterion: "작업 모드는 범용 결과와 예상 영향 차이를 설명하며 개별 permission은 고급 상세에서 확인 가능하다."
  - id: AC-12
    criterion: "승인 상세를 열지 않아도 목적, 영향 대상·유형과 허용·거절 결과를 판단하고 원시 근거도 확인할 수 있다."
  - id: AC-13
    criterion: "runtime 미제공 승인 정보는 확인 불가로 표시하며 승인·거절·취소는 중복 처리되지 않고 timeline에 남는다."
  - id: AC-14
    criterion: "취소·거절 결과는 결정 주체·시점, 중단 전 완료 범위, 부분 결과 보존 여부와 실제 다음 행동을 보여준다."
  - id: AC-15
    criterion: "완료·부분 결과는 수행 내용, 생성·수정·삭제 또는 변경 없음, 검증, 미완료·위험과 제공 가능한 근거를 구분한다."
  - id: AC-16
    criterion: "Task 상세과 /chat/:taskId에서 동일 Task의 요청, 참고 자료, 승인, 결과와 후속 요청 내용·순서가 일치한다."
  - id: AC-17
    criterion: "어느 진입점의 후속 요청도 동일 Task에 새 사건과 run으로 연결되고 별도 Task를 암묵적으로 만들지 않는다."
  - id: AC-18
    criterion: "composer는 이미지 붙여넣기, 파일 선택·드롭과 링크를 지원하고 전송 전 자료별 처리·포함·제거 상태를 보여준다."
  - id: AC-19
    criterion: "첨부 하나가 실패해도 다른 입력은 유지되며 실패 항목만 재시도·제거할 수 있다."
  - id: AC-20
    criterion: "전송 후 어느 요청과 run이 어떤 참고 자료를 사용했는지와 후속 요청의 재사용 여부를 확인한다."
  - id: AC-21
    criterion: "전문 설정은 예상 결과·시간·범위를 설명하되 확인되지 않은 비용이나 품질을 보장하지 않는다."
  - id: AC-22
    criterion: "핵심 흐름은 keyboard로 완료되며 상태가 색상이나 motion에만 의존하지 않는다."
  - id: AC-23
    criterion: "신뢰 가능한 runtime 데이터 계약이 정해지기 전 비용·자원 추정값을 제품 사실처럼 표시하지 않는다."

resolved_questions:
  - id: OQ-01
    resolution: "인증 runtime과 호환되는 실행 가능 Agent 한 쌍을 readiness로 확정; workspace 조회 실패는 별도 splash error"
  - id: OQ-02
    resolution: "Project는 안내 단계지만 일반 대화의 필수 조건이 아니며 대화부터 시작 허용"
  - id: OQ-03
    resolution: "첫 Task는 onboarding 밖 dashboard의 첫 성공 행동"
  - id: OQ-04
    resolution: "직접 구성 확인 후 dashboard 이동; Task 진입점 inline 해결과 onboarding 재개 제공"

open_questions:
  - id: OQ-05
    owner: "Runtime Integrator / Full-stack Developer"
    question: "각 runtime 승인 event가 목적, 영향 유형·대상, 되돌림 가능성, 명령과 작업 폴더를 어느 수준까지 안정적으로 제공하는가?"
    blocking_stage: "Developer contract; UI는 missing-information 상태를 우선 설계 가능"
  - id: OQ-06
    owner: "Product Architect / Security Reviewer"
    question: "작업 모드별 permission 기본값과 추가 승인 정책은 무엇이며 Claude/Codex capability 차이를 어떻게 사용자 기대와 일치시킬 것인가?"
    blocking_stage: "작업 모드 구현 전"
  - id: OQ-07
    owner: "Runtime Integrator"
    question: "코드 외 작업까지 공통으로 제공 가능한 구조화된 변경 목록과 verification 신호는 무엇인가?"
    blocking_stage: "자동 결과 요약 구현 전"
  - id: OQ-08
    owner: "Product / UI Designer / Full-stack Developer"
    question: "Task 상세과 Chat을 한 route로 통합할지 동일 session을 공유하는 두 표면으로 유지할지?"
    blocking_stage: "UI 정보 구조 확정 전; session 일관성 계약은 확정"
  - id: OQ-09
    owner: "Product Architect / Security Reviewer"
    question: "로컬 파일과 붙여넣은 이미지는 원본 참조, 앱 저장소 복사, run snapshot 중 어떤 정책을 사용하며 runtime에 어떻게 전달하는가?"
    blocking_stage: "첨부 구현 전"
  - id: OQ-10
    owner: "Product / Security Reviewer"
    question: "웹 링크는 URL 텍스트, 실행 시 fetch 대상, snapshot 중 무엇이며 외부 통신 승인을 언제 받는가?"
    blocking_stage: "링크 첨부 구현 전"
  - id: OQ-11
    owner: "Runtime Integrator / Product"
    question: "Codex와 Claude가 토큰, 비용, 시간, session limit을 어떤 정확도와 단위로 제공하며 비교 가능한가?"
    blocking_stage: "비용·자원 범위 결정 전; 현재 deferred"
  - id: OQ-12
    owner: "UI Designer"
    question: "Pet 출근 splash의 motion, reduced-motion 대체, 긴 확인과 오류 상태를 pixel visual language로 어떻게 표현할 것인가?"
    blocking_stage: "UI Handoff"

handoff_validation:
  required_fields:
    type: present
    revision: present
    status: present
    problem: present
    user_goal: present
    primary_flow: present
    states: present
    edge_cases: present
    acceptance_criteria: present
    open_questions: present
  role_boundary: "UX 흐름과 관찰 가능한 결과만 결정했으며 시각 스타일, API, database와 runtime 매핑은 결정하지 않았다."
  question_preservation: "revision 1의 OQ-01~04는 resolved_questions와 decision-log에 보존했고 OQ-05~12는 owner와 blocking stage를 유지했다."
  readiness_assessment: "제품 흐름을 막던 OQ-01~04가 해결되어 UI Designer가 상태·화면 명세를 시작할 수 있다. 남은 질문은 UI에서 unknown 상태를 정의하거나 해당 구현 전에 해결 가능하므로 status를 ready로 판단한다."

next_handoff:
  target_role: "UI Designer"
  requested_output: "revision 2를 기반으로 splash, onboarding, dashboard inline blocker, Task timeline·approval·attachment의 화면 계층과 component states를 정의한다."
  constraints:
    - "OQ-05의 정보 누락 상태와 OQ-12 reduced motion을 반드시 포함한다."
    - "OQ-06~10의 기술 capability를 UI 사실로 가정하지 않는다."
