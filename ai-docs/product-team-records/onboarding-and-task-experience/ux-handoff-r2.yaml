decision_log: "ai-docs/product-team-records/onboarding-and-task-experience/decision-log.yaml"

revision_summary:
  preserved:
    - "revision 1의 승인 정보 계층, 취소·거절 결과, 작업 모드, 결과 요약, Task session timeline, 참고 자료와 전문 설정 범위"
    - "revision 1의 runtime·권한·결과·첨부·비용·시각 표현 관련 미해결 질문"
  resolved:
    - "dashboard 직행 readiness와 workspace 조회 오류의 분리"
    - "Project 연결의 선택성"
    - "첫 Task를 dashboard 첫 성공 행동으로 배치"
    - "직접 구성의 dashboard 목적지와 이후 inline 복구"

scope:
  included:
    - "Pet 출근 맥락의 splash 동안 workspace와 readiness 확인"
    - "미준비 사용자의 전체 화면 단계형 onboarding"
    - "dashboard에서의 첫 Task 성공과 미완료 조건 inline 해결"
    - "승인 요청의 목적·영향·기술 상세 3단 정보 계층"
    - "취소·거절을 포함한 실행 결과와 단일 Task session timeline"
    - "범용 작업 모드와 전문 설정의 결과 중심 설명"
    - "변경·검증 결과 요약"
    - "이미지 붙여넣기, 파일 선택·드롭, 링크 참고 자료"
  deferred:
    - "비용·자원 가시성은 runtime별 신뢰 가능한 데이터 조사 후 결정"
  excluded:
    - "시각 스타일, sprite, motion curve와 component 구현"
    - "runtime permission 매핑, 첨부 저장 및 API·database 아키텍처"

evidence:
  usability_source:
    path: "ai-docs/usability-records/full-journey-2026-09-08.md"
    limitation: "실제 사용자 조사가 아닌 코드 기반 시뮬레이션"
  canonical_sources:
    - "ai-docs/adr/009-ui-ux-information-architecture.md"
    - "ai-docs/adr/010-ui-ux-improvement-log.md"
  verified_current_behavior:
    - "App은 workspace 조회 중 전체 화면 메시지를 표시하지만 readiness 분기와 onboarding은 없다."
    - "Settings에는 runtime 설치·인증 상태와 기존 설치·로그인 행동이 있다."
    - "Task 상세과 Chat은 run 기반 메시지와 후속 요청을 각각 제공하지만 표현과 route가 나뉜다."
    - "Task에는 Knowledge Document 선택이 있으나 로컬 파일·클립보드 이미지·드롭 첨부는 없다."
    - "서버는 cancelled run과 부분 산출물 보존 activity를 남기지만 UI 결과 요약은 불완전하다."
    - "승인 UI는 reason과 command를 표시하지만 영향 범위와 거절 이후를 충분히 설명하지 않는다."
    - "Agent 고급 설정은 개별 permission과 reasoning effort를 사용하며 fileRead·terminal은 실행 필수다."

problem: >-
  신규 또는 설정이 불완전한 사용자는 앱의 실행 준비 상태를 알기 전에 Task 진입점을 만나며, 실행 전에는
  승인과 권한의 영향을, 실행 후에는 변경·검증·취소·거절 결과를 업무 언어로 판단하기 어렵다. 요청,
  참고 자료, 승인, 결과와 후속 요청도 Task 상세과 Chat에서 하나의 지속되는 작업 맥락으로 충분히 연결되지 않는다.

user_goal: >-
  사용자는 앱 시작 시 준비 확인 결과를 이해하고, 필요한 설정을 단계별로 완료하거나 직접 구성으로 건너뛴 뒤
  dashboard에서 첫 Task를 시작한다. 이후 한 Task 안에서 참고 자료, 승인, 결과와 후속 요청의 전체 이력을
  쉬운 요약과 필요할 때의 기술 근거로 확인한다.

readiness_contract:
  workspace_gate:
    success: "workspace를 조회하거나 정상 생성한 뒤 readiness를 판정한다."
    failure: "onboarding으로 보내지 않고 별도 splash error를 표시한다."
  ready_when:
    - "지원 runtime 중 하나 이상이 인증되어 있다."
    - "인증된 runtime 중 하나로 실행 가능한 Agent가 하나 이상 있다."
  not_required:
    - "Project 연결"
    - "기존 Task 또는 첫 Task 생성"
    - "지원하는 모든 runtime의 인증"
  matching_rule: "인증된 runtime과 실행 가능한 Agent가 서로 호환되는 한 쌍이어야 하며 독립된 두 조건의 단순 존재만으로 ready 처리하지 않는다."

primary_flow:
  - id: launch
    user_action: "앱을 실행한다."
    system_response: "Pet 출근 맥락의 splash에서 workspace 조회와 준비 확인 상태를 텍스트로 알린다."
    completion: "workspace 조회 실패면 splash error, 성공하면 readiness 분기로 이동한다."
  - id: ready-dashboard
    precondition: "인증된 runtime과 호환되는 실행 가능 Agent가 하나 이상 있음"
    user_action: "추가 행동 없음"
    system_response: "onboarding을 반복하지 않고 dashboard로 이동한다."
    completion: "첫 Task 또는 기존 업무에 접근한다."
  - id: not-ready-onboarding
    precondition: "workspace 조회는 성공했으나 readiness 조건이 미충족"
    user_action: "첫 미완료 단계와 전체 순서를 확인한다."
    system_response: "완료 단계는 건너뛰고 기존 UI 계약을 단계 맥락에서 제공한다."
    completion: "현재 단계의 목적, 입력, 완료 조건과 직접 구성 행동을 이해한다."
  - id: connect-runtime
    user_action: "AI를 선택해 기존 설치·로그인을 완료하고 다음을 누른다."
    system_response: "인증 상태를 다시 확인하고 성공할 때만 완료 처리한다."
    completion: "인증된 runtime이 하나 이상 있다."
  - id: create-colleague
    user_action: "AI 동료의 이름, 맡길 일과 작업 모드를 정하고 다음을 누른다."
    system_response: "기존 Agent 계약으로 저장하고 선택 결과와 영향 범위를 요약한다."
    completion: "인증된 runtime과 호환되는 실행 가능 Agent가 존재한다."
  - id: guide-project
    user_action: "로컬 자료를 다룰 계획이면 작업 폴더를 연결하고, 아니면 '지금은 대화부터 시작'을 선택한다."
    system_response: "폴더 연결은 기존 Project 계약으로 저장한다. 대화부터 시작하면 파일 작업에는 나중에 연결이 필요함을 설명한다."
    completion: "Project 생성 또는 명시적 대화 시작 선택"
  - id: finish-onboarding
    user_action: "완료 요약에서 dashboard로 이동한다."
    system_response: "Task를 자동 생성하지 않고 dashboard의 첫 작업 행동을 제시한다."
    completion: "사용자가 dashboard에서 첫 Task를 시작할 수 있다."
  - id: configure-directly
    user_action: "어느 단계에서든 '제가 직접 구성할래요'를 선택하고 결과를 확인한다."
    system_response: "완료 데이터는 유지하고 dashboard로 이동하며 onboarding 재개 진입점을 제공한다."
    completion: "관련 Task 진입점은 미완료 조건과 inline 해결 행동을 표시한다."
  - id: first-task
    user_action: "dashboard에서 첫 Task를 작성한다."
    system_response: "일반 대화는 Project 없이 진행하고, 로컬 자료·파일 작업에는 Project 연결 필요와 inline 해결 행동을 보여준다."
    completion: "조건 충족 시 첫 Task를 생성하며 해결 화면을 다녀온 경우 작성 내용을 복원한다."
  - id: compose-with-reference
    user_action: "Task 또는 Chat에서 텍스트와 이미지 붙여넣기, 파일 선택·드롭 또는 링크를 추가해 보낸다."
    system_response: "자료별 처리·포함 상태를 보여주고 요청과 같은 Task 사건으로 기록한다."
    completion: "요청과 사용 자료의 관계가 timeline에 남는다."
  - id: decide-approval
    user_action: "승인 목적, 영향과 기술 상세를 확인하고 허용 또는 거절한다."
    system_response: "결정을 중복 처리하지 않고 동일 Task timeline에 결과를 기록한다."
    completion: "승인 시 같은 run이 계속되고 거절 시 terminal result와 다음 행동이 남는다."
  - id: review-and-follow-up
    user_action: "수행·변경·검증·남은 일 요약을 확인하고 후속 요청을 보낸다."
    system_response: "Task 상세과 Chat에 동일한 사건 순서로 새 요청과 run을 추가한다."
    completion: "사용자가 화면을 바꿔도 같은 Task 맥락을 이어간다."

work_modes:
  intent: "permission 이름보다 사용자가 기대하는 결과와 영향 범위를 먼저 설명한다."
  candidates:
    - id: discuss
      label: "대화하고 정리하기"
      outcome: "아이디어, 문서 내용이나 계획에 답하고 요약·초안을 만든다."
      expected_impact: "사용자 자료를 바꾸지 않는 기대를 먼저 설명한다."
    - id: inspect
      label: "자료를 살펴보고 제안하기"
      outcome: "연결한 자료와 작업 폴더를 조사해 문제와 개선안을 제안한다."
      expected_impact: "조사 범위와 외부 접근 가능성을 실행 전에 확인한다."
    - id: change
      label: "자료를 만들고 변경하기"
      outcome: "파일이나 프로젝트에 결과를 만들거나 수정하고 검증한다."
      expected_impact: "변경 범위와 추가 승인이 필요한 행동을 설명한다."
  constraint: "label은 사용자 언어 검증 전 working copy이며 실제 permission보다 강한 안전 보장을 해서는 안 된다."
  advanced_access: "개별 permission은 고급 설정에서 확인·조정 가능한 기술 근거로 유지한다."

approval_contract:
  level_1:
    name: "결정 요약"
    content: ["왜 필요한지", "허용하면 무엇이 계속되는지", "거절하면 이번 실행이 어떻게 되는지"]
  level_2:
    name: "영향"
    content: ["영향 유형", "대상 또는 범위", "승인 유효 범위", "되돌림 가능 또는 확인 불가"]
  level_3:
    name: "기술 근거"
    content: ["원시 명령/runtime 상세", "작업 폴더", "요청·실행 ID와 로그"]
  missing_information: "runtime이 제공하지 않은 정보를 추측하지 않고 확인 불가로 표시한다."

result_contract:
  universal_sections:
    - "무엇을 했는지"
    - "무엇이 생성·수정·삭제되었는지 또는 변경 없음"
    - "어떻게 검증했고 무엇을 확인하지 못했는지"
    - "남은 일, 위험과 사용자 결정 사항"
    - "제공 가능한 diff, 파일, 산출물 또는 원시 로그"
  cancelled_or_denied:
    - "취소와 거절을 terminal result로 기록한다."
    - "결정 주체·시점, 중단 전 완료 범위와 부분 결과 보존 여부를 표시한다."
    - "보존 여부를 모르면 확인 불가로 표시한다."
    - "재시도, 요청 수정, 설정 변경 중 실제 가능한 다음 행동을 제공한다."

timeline_contract:
  canonical_unit: "Task session"
  ordered_events:
    [
      "최초 요청·참고 자료",
      "실행·진행",
      "승인 요청·결정",
      "성공·실패·취소·거절 결과",
      "후속 요청·새 run",
    ]
  consistency: "Task 상세과 /chat/:taskId는 같은 Task session을 열며 사건 내용·순서·참고 자료 관계가 일치한다."
  navigation: "표면을 바꿔도 가능한 범위에서 draft, 마지막 읽은 위치와 선택 맥락을 보존한다. route 통합 여부는 후속 역할이 결정한다."

attachment_contract:
  inputs: ["클립보드 이미지 붙여넣기", "파일 선택", "파일 드롭", "웹 링크"]
  before_send:
    - "자료별 이름, 종류, 처리 상태, 포함 여부와 제거 행동을 표시한다."
    - "이미지는 구분 가능한 이름과 미리보기를 제공한다."
    - "실패 자료만 다시 시도하거나 제거할 수 있고 다른 입력은 유지한다."
    - "지원하지 않는 형식·크기·접근 실패를 전송 전에 설명한다."
  after_send:
    - "요청과 run이 사용한 자료 version 또는 snapshot 관계를 확인한다."
    - "후속 요청에서 기존 자료 재사용 여부를 확인·변경한다."
    - "첨부 전 로컬 자료의 전달·복사·보존 범위를 알린다."

expert_setting_explanations:
  model: "사용 AI와 연결 상태, 확인된 기능·결과 차이"
  reasoning_effort: "속도와 검토 깊이의 경향 및 시간·사용량 증가 가능성; 품질 보장 금지"
  skill: "특정 일을 수행할 때 따를 작업 방법과 필요한 접근 범위"
  workflow: "여러 동료 또는 단계의 수행·검토 순서"

