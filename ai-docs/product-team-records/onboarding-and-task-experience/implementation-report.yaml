type: implementation-report
status: complete_with_deviations
source_ux_handoff: "ux-handoff-r2.yaml"
source_ui_handoff: "ui-handoff-r2.yaml"
implemented_scope:
  - "workspace 조회 중 Pet 출근 splash와 workspace/readiness 오류 재시도 화면"
  - "prefers-reduced-motion에서 이동 animation을 제거한 정적 Pet 장면과 동일한 텍스트 상태"
  - "인증 runtime과 fileRead·terminal 권한을 가진 동일 runtime Agent 조합으로 계산하는 canonical readiness"
  - "ready 사용자의 dashboard 직행과 not-ready 사용자의 fullscreen 3단계 onboarding 분기"
  - "desktop runtime 설치·로그인 bridge, Agent create API, Project directory picker/create API를 사용하는 단계별 저장"
  - "약 720px 단일 중앙 컬럼, 자연 document scroll, 완료 단계 역이동이 가능한 3단계 onboarding"
  - "Settings와 같은 5개 상태 문법의 runtime 선택 행과 연결 runtime radio 선택"
  - "Settings와 onboarding이 공유하는 system/ConnectionCard 및 Today 작업 필터와 Pet 종 필터가 공유하는 FilterBar"
  - "강아지·고양이 교차 정렬, 전체·강아지·고양이 필터, radio semantics를 갖춘 Pet 선택"
  - "선택적 Project 폴더·이름·목표 입력과 Project.description 저장, 이전·완료만 제공하는 마지막 단계"
  - "생성 Project ID를 recent-project 계약에 저장해 첫 Task composer와 Chat 기본 프로젝트로 사용"
  - "모든 단계의 '제가 직접 구성할래요' dashboard 이동 및 workspace별 localStorage 선택 보존"
  - "dashboard의 onboarding 재개 notice와 미준비 Task composer inline blocker"
  - "Task title·description·priority의 sessionStorage draft 보존과 성공 생성 뒤 정리"
changed_contracts:
  - "App entry가 workspace 성공 뒤 system-status와 agents를 함께 조회해 AppShell 또는 OnboardingFlow를 선택한다."
  - "TodayPage와 dashboard TaskComposer가 optional readiness recovery contract를 입력으로 받는다."
  - "PetChoice는 onboarding에서만 활성화하는 optional radio semantics와 종·품종 accessible name을 지원한다."
  - "미준비 사용자의 직접 구성 선택은 manual-config:<workspaceId> localStorage key로 재시작 뒤에도 유지하며, 설정 이어하기가 해당 선택을 지우고 onboarding을 다시 연다. readiness가 true이면 preference와 무관하게 dashboard를 표시한다."
  - "서버, domain, runtime protocol, Electron IPC 및 database 계약은 변경하지 않았다."
verification:
  - command: "pnpm --filter @ai-pixel-office/web typecheck"
    result: pass
  - command: "eslint App/onboarding/TodayPage/TaskComposer --quiet"
    result: pass
  - command: "pnpm --filter @ai-pixel-office/web build"
    result: pass
  - command: "pnpm test"
    result: "pass (49 tests)"
  - command: "desktop interactive acceptance"
    result: not_run
    reason: "실제 runtime 설치·OAuth 창과 native directory picker를 조작하는 수동 환경이 필요하다."
deviations:
  - id: DEV-01
    specification: "직접 구성 선택 전에 DirectConfigDialog로 완료 데이터와 저장하지 않은 입력의 유지·폐기를 확인"
    implementation: "첫 slice에서는 underline button이 즉시 dashboard로 이동하고 workspace별 선택을 localStorage에 보존한다. 이미 서버에 저장된 runtime/Agent/Project는 유지되지만 현재 단계의 미저장 입력은 유지하지 않는다."
    reason: "기존 Dialog 계약을 연결한 확인 flow와 focus-return acceptance를 이번 최소 구현에서 완결하지 못했다."
    impact: "실수로 건너뛰었을 때 현재 입력을 다시 작성해야 할 수 있다."
  - id: DEV-03
    specification: "inline 해결 왕복 후 composer와 focus를 즉시 복원"
    implementation: "draft는 sessionStorage에서 복원되지만 dashboard 복귀 시 composer를 자동으로 다시 열거나 focus를 복원하지 않는다."
    reason: "App gate가 onboarding 동안 TodayPage를 unmount하며 dialog open/focus 상태의 상위 ownership이 아직 없다."
    impact: "사용자가 새 작업 버튼을 다시 눌러야 보존된 draft를 확인한다."
  - id: DEV-04
    specification: "workspace error의 오류 상세 보기와 진입 focus"
    implementation: "오류 요약과 retry, 데이터 보존 문구는 제공하지만 별도 기술 상세 disclosure와 programmatic focus는 없다."
    reason: "workspace API error에 사용자용 요약과 분리된 안정적인 detail 구조가 없다."
    impact: "키보드/진단 acceptance의 일부가 남는다."
unresolved_questions:
  - "DEV-01의 확인 dialog와 미저장 onboarding draft 보존을 다음 revision에서 필수로 할지 결정 필요. 직접 구성 preference 자체는 workspace별로 지속된다."
  - "runtime 설치·로그인 뒤 polling timeout, 취소, 브라우저 fallback을 공용 ConnectionCard 추출로 통합할지 결정 필요"
  - "Task 요청이 파일 작업을 요구하는지를 구조적으로 알 수 없어 Project 미연결 blocker는 구현하지 않았다. 의도 판정 contract가 필요하다."
  - "기존 Agent 중 인증 runtime과 model은 맞지만 필수 실행 권한이 없는 경우 새 Agent 생성 외에 onboarding 안에서 수정할 계약이 필요하다."
