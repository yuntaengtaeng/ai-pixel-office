type: implementation-report
revision: 3
status: complete_with_deviations
source_ux_handoff: "ux-handoff-r3.yaml"
source_ui_handoff: "ui-handoff-r3.yaml"
implemented_scope:
  - "workspace splash, 조회 오류와 runtime-Agent readiness 분기"
  - "첫 업무 draft 입력과 workspace별 localStorage 복원"
  - "Settings 공용 ConnectionCard를 이용한 Codex·Claude 설치·인증 상태와 행동"
  - "단일 runtime 자동 사용, 복수 runtime SegmentedControl 명시 선택"
  - "선택 runtime의 read-only fit preview로 이름·역할·추천 이유와 unlocked dog/cat 후보 생성"
  - "EmployeeBadge 사원증 preview에서 이름·역할·Pet 편집"
  - "선택 Project 폴더·이름·목표와 Project.description 및 recent-project 저장"
  - "Agent, 선택 Project, Task와 run 생성 뒤 /tasks/:id replace navigation"
  - "desktop 동일 높이 green onboarding sidebar와 border 없는 content surface, body-only scroll"
  - "공용 OfficeSidebar, SegmentedControl, PixelWorkLoader, EmployeeBadge, FilterBar 추출"
  - "신규 Agent 설정에서 authenticated runtime만 노출하고 기존 Agent의 끊긴 runtime 값 보존"
  - "dashboard 직접 구성, onboarding 재개와 Task composer draft 복원"
changed_contracts:
  - "Claude runtime은 Agent SDK canUseTool callback으로 interactive approval을 normalized permission_requested event와 approval activity metadata로 전환한다."
  - "POST /api/agents/fit-preview는 intent와 runtime을 받아 Agent·Task를 저장하지 않고 ColleagueFit을 반환한다."
  - "ColleagueFit은 name, role, rationale, unlocked dog/cat petIds와 petRationale을 검증한다."
  - "Onboarding 완료 callback은 optional taskId를 받아 Task session으로 replace navigation한다."
  - "fit preview와 생성 Agent는 사용자가 확정한 동일 runtime을 사용한다."
  - "온보딩에서 명시적으로 만든 Project는 첫 Task projectId와 recent-project가 된다."
  - "server/domain database schema, Electron IPC와 normalized runtime event 계약은 변경하지 않았다."
verification:
  - command: "apps/web npm run typecheck"
    result: pass
  - command: "target eslint --quiet"
    result: pass
  - command: "apps/web npm run build"
    result: pass
  - command: "apps/server npm run typecheck"
    result: pass
  - command: "npm test -- --runInBand"
    result: "pass (49 tests)"
  - command: "apps/server npm run build"
    result: not_run
    reason: "managed sandbox가 esbuild의 상위 경로 조회를 차단했고 escalation 실행은 중단됐다."
  - command: "desktop interactive acceptance"
    result: not_run
    reason: "실제 runtime OAuth, fit 응답과 native directory picker 조작이 필요하다."
deviations:
  - id: DEV-R3-01
    specification: "fit preview 취소와 timeout 복구"
    implementation: "60초 runtime timeout과 오류 재시도는 있으나 사용자가 진행 중 preview를 취소하는 endpoint는 없다."
    impact: "긴 preview 중에는 완료나 timeout까지 기다려야 한다."
  - id: DEV-R3-02
    specification: "부분 성공의 재시작 포함 멱등 복구"
    implementation: "현재 mounted flow 안에서는 생성 Agent, Project와 Task ref를 재사용하지만 앱 재시작 뒤 operation id 복구는 없다."
    impact: "응답 유실 직후 앱을 재시작하고 다시 완료하면 중복 entity 가능성이 남는다."
  - id: DEV-R3-03
    specification: "직접 구성 전 확인과 focus 복원"
    implementation: "draft는 보존하지만 별도 확인 dialog와 dashboard composer focus 복원은 없다."
    impact: "사용자가 dashboard에서 composer를 다시 열어야 할 수 있다."
  - id: DEV-R3-04
    specification: "workspace error 상세와 진입 focus"
    implementation: "요약과 retry는 제공하지만 안정적인 기술 상세 구조와 programmatic focus가 없다."
    impact: "진단과 keyboard acceptance 일부가 남는다."
unresolved_questions:
  - "fit preview cancellation을 공통 runtime cancellation contract로 제공할지 결정 필요"
  - "launch에 server-side idempotency key와 상태 조회 endpoint를 추가할지 결정 필요"
  - "runtime 인증 취소, 외부 창 닫기와 timeout을 runtime별로 구분할 수 있는지 확인 필요"
  - "600px 미만 desktop 높이와 200% zoom의 고정 stage acceptance를 수동 검증해야 함"
  - "OQ-05~11 승인 metadata, 권한, 구조화 결과, Task/Chat IA, 첨부·링크와 비용 계약은 r2에서 유지"
  - "blocked는 domain 상태와 UI에는 존재하지만 orchestrator가 생산하지 않아 현재 사용자 흐름으로 검증할 수 없다. OQ-12에서 runtime 차단 계약 또는 상태 제거를 결정해야 한다."
