type: ux-handoff
revision: 4
status: proposed
supersedes: "종료된 runtime session을 다시 시작하는 경험에 관한 신규 handoff; ux-handoff-r3의 Task/Chat 분리 결정은 유지한다."
problem: "Codex와 Claude는 종료된 대화 session을 resume할 수 있고 AgentRun에는 runtimeThreadId가 남지만, 제품에서는 needs_input 안전 제한을 해소할 때만 같은 session을 이어갈 수 있다. 완료 또는 취소된 업무를 이어 하려면 사용자는 이전 맥락을 포기하고 새 Task를 만들거나, 제품 밖에서 CLI 명령을 직접 실행해야 한다."
user_goal: "이미 끝냈거나 중단한 업무를 찾고, 그때의 AI 대화 맥락을 명시적으로 선택해 새로운 지시와 함께 안전하게 이어서 실행한다."
recommendation:
  decision: "완료 또는 취소 후 todo로 돌아간 Task에 대해, 사용자가 특정 종료 Run에서 '이 세션 이어가기'를 명시적으로 선택하면 기존 Task를 working으로 재활성화한다. 새 linked follow-up Task를 자동 생성하지 않는다."
  rationale:
    - "사용자가 보기에 하나의 업무 목표와 그 결과·대화·승인 이력은 하나의 Task에 남는다."
    - "Task를 새로 만들면 같은 목표의 상태와 결과가 분산되고, 어떤 Task가 현재 업무인지 추가로 해석해야 한다."
    - "새 Run을 추가하므로 이전 완료·취소 기록은 수정하거나 지우지 않으며, 재개 사실과 출발 Run을 이력에서 구분할 수 있다."
  alternative_not_selected: "새 linked follow-up Task를 만들고 같은 runtime session만 resume한다. 이 방식은 독립적인 새 업무에 적합하지만, 여기서는 사용자가 같은 Task의 명시적 재개를 요구했으므로 기본 흐름으로 삼지 않는다."
primary_flow:
  - id: locate-terminal-run
    action: "사용자는 완료된 Task 또는 취소 후 todo인 Task의 실행 이력에서 종료된 Run을 확인한다."
    outcome: "같은 runtime의 resume 가능한 session을 가진 Run에만 '이 세션 이어가기' 행동이 제공된다."
  - id: choose-session
    action: "사용자는 이어갈 Run을 명시적으로 선택한다."
    outcome: "여러 종료 Run이 있으면 마지막 Run을 자동으로 재개하지 않고, 선택한 Run의 대화 맥락과 runtime을 기준으로 한다."
  - id: provide-follow-up
    action: "사용자는 '이전 맥락으로 무엇을 이어갈까요?'에 새 지시를 입력하고 실행을 확인한다."
    outcome: "빈 재개를 막고, 무엇이 새 요청인지 대화 이력에서 식별 가능하다."
  - id: resume-existing-task
    action: "제품은 기존 Task를 working으로 전환하고 선택 Run에 연결된 runtime session을 사용해 새 Run을 시작한다."
    outcome: "동일 Task의 기존 대화·결과·승인·Run 이력은 보존되고, 새 Run이 재개 출발 Run을 참조해 추가된다."
  - id: continue-or-close
    action: "사용자는 새 Run의 진행, 승인 요청, 결과를 기존 Task와 Chat의 동일 session surface에서 확인한다."
    outcome: "새 Run이 정상 완료되면 Task는 다시 done이 되고, 실패·취소·입력 대기는 기존 Task lifecycle의 해당 상태로 전이한다."
states:
  - id: resumable-terminal-run
    user_visible: "종료 Run, 사용 runtime, 종료 시점·결과 요약, 이 세션 이어가기 행동"
    next_actions: "해당 Run 선택 또는 다른 Run 이력 확인"
  - id: non_resumable-terminal-run
    user_visible: "이 session은 제품에서 다시 열 수 없다는 이유와 새 업무 시작 행동"
    next_actions: "새 Task 작성 또는 재시도 가능한 기존 행동"
  - id: resume-composer
    user_visible: "선택한 runtime과 이전 Run을 식별하는 정보, 새 지시 입력, 취소·실행 행동"
    next_actions: "지시 입력 후 실행 또는 취소"
  - id: resume-starting
    user_visible: "기존 Task를 다시 시작하는 진행 상태; 중복 실행 행동은 비활성"
    next_actions: "Task session에서 진행 확인"
  - id: resumed-working
    user_visible: "기존 Task 안에서 새 Run이 진행 중임과 재개 출발 Run의 관계"
    next_actions: "기존 working 상태에서 가능한 관찰·취소·승인 행동"
  - id: resume-recoverable-error
    user_visible: "재개를 시작하지 못한 원인과 새 지시를 보존한 재시도 또는 복구 행동"
    next_actions: "재시도, runtime 재연결, Project 복구, 취소"
edge_cases:
  - "runtimeThreadId가 없거나 runtime이 해당 session resume을 지원하지 않으면 재개 행동을 제공하지 않는다. 새 Task 또는 기존 재시도 행동을 안내한다."
  - "선택 Run의 runtime이 연결 해제되었거나 인증이 끝났으면, 입력한 후속 지시를 보존한 채 해당 runtime 재연결을 먼저 요구한다. 다른 runtime으로 session을 이어간다고 표현하거나 자동 전환하지 않는다."
  - "Task에 active run이 있으면 동시에 재개할 수 없다. 현재 실행을 표시하고 실행이 끝난 뒤 새로 판단한다."
  - "완료(done)와 취소 후 todo 모두 재개 대상이지만, needs_input은 이미 존재하는 승인·입력 응답 흐름을 계속 사용하며 '종료 session 재개'로 중복 노출하지 않는다."
  - "재개 실행에 필요한 Project 또는 작업 경로가 없어졌거나 접근할 수 없으면, 과거 파일 상태가 그대로라는 약속을 하지 않는다. 실행 전에 사용자가 Project/경로를 복구·확인하는 흐름이 필요하다."
  - "재개된 세션의 대화 맥락·권한·승인 범위는 Codex 또는 Claude가 제공한 native resume semantics를 그대로 따른다. 제품은 이를 별도로 복제·초기화·확장하지 않는다."
  - "새 Run 시작이 실패하면 Task를 working으로 남기지 않고, 이전 terminal Task 상태와 이력을 보존한다. 사용자가 재시도할 수 있어야 한다."
  - "재개 중 사용자가 취소하면 새 Run의 취소 결과만 이력에 남기며, 이전 Run의 완료·취소 결과를 덮어쓰지 않는다."
  - "같은 Task에 여러 종료 Run이 있으면 각 Run의 출발 맥락을 명확히 식별해 사용자가 의도하지 않은 오래된 session을 선택하지 않게 한다."
acceptance_criteria:
  - "사용자는 완료된 Task와 취소 후 todo인 Task에서, resume 가능한 특정 종료 Run을 식별하고 명시적으로 선택할 수 있다."
  - "재개 전 새 지시를 입력해야 하며, 실행 runtime과 출발 Run이 사용자에게 드러난다."
  - "재개는 새 linked Task가 아니라 기존 Task를 working으로 되돌리고, 이전 대화·결과·Run 이력을 보존한다."
  - "새 Run은 재개임과 출발 Run의 관계를 이력에서 확인할 수 있고, 이전 terminal Run의 기록은 변경되지 않는다."
  - "Task 상세과 Chat은 r3 결정대로 분리된 surface를 유지하면서 같은 재개 Run의 상태와 이력을 일관되게 표시한다."
  - "연결 해제, session 미지원, active run, Project/경로 불가, 시작 실패의 경우 사용자는 원인과 다음 복구 행동을 알 수 있고 입력한 새 지시를 잃지 않는다."
  - "재개 후 AI가 새 도구 권한을 요구하면 해당 provider가 resume session에서 발생시킨 현재 승인 흐름을 따른다."
  - "재개는 provider가 보존한 세션 맥락을 사용하되, 제품은 현재 Project 경로와 실행 범위를 다시 검증한다. 과거 디스크 snapshot을 별도로 복원한다고 약속하지 않는다."
open_questions:
  - id: OQ-13
    owner: "Runtime Integrator"
    question: "Codex와 Claude 각각에서 저장된 runtimeThreadId가 종료 후에도 resume 가능한지, 만료·삭제·다른 CLI/SDK 버전의 실패 원인을 어떤 안정적인 capability/result로 제공할 수 있는가?"
  - id: OQ-14
    owner: "Full-stack Developer / Product Architect"
    question: "Task의 done 또는 todo → working 재활성화, 새 AgentRun의 resumeFromRunId 기록, active-run 동시성 검증을 하나의 원자적 lifecycle 계약으로 제공할 수 있는가?"
  - id: OQ-15
    owner: "Product Architect / Security Reviewer"
    question: "재개 전 Project path와 run snapshot을 어떤 기준으로 검증·복구하게 할지, 경로 또는 파일이 바뀐 경우 사용자가 승인해야 하는 범위는 무엇인가?"
  - id: OQ-16
    owner: "Product / UX Designer"
    question: "'이 세션 이어가기'를 모든 terminal Run row에 노출할지, 마지막 resume 가능한 Run만 기본 노출하고 이력에서 선택하도록 할지 실제 사용성 검증이 필요한가?"
