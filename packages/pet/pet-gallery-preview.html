<title>Pet Catalog</title>
<style>
  :root {
    --bg: #1c1a22;
    --surface: #26232e;
    --surface-raised: #2f2c39;
    --border: #3c3849;
    --text: #f1ede4;
    --text-muted: #a49cb0;
    --text-faint: #766e84;
    --accent: #e7a43b;
    --accent-soft: #4a3d24;
    --lock: #6c6478;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="light"]) {
      --bg: #f3efe6;
      --surface: #ffffff;
      --surface-raised: #faf7ef;
      --border: #ddd4c2;
      --text: #241f2e;
      --text-muted: #6b6377;
      --text-faint: #948c9e;
      --accent: #b5741f;
      --accent-soft: #f3e2c2;
      --lock: #c3bccb;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3efe6;
    --surface: #ffffff;
    --surface-raised: #faf7ef;
    --border: #ddd4c2;
    --text: #241f2e;
    --text-muted: #6b6377;
    --text-faint: #948c9e;
    --accent: #b5741f;
    --accent-soft: #f3e2c2;
    --lock: #c3bccb;
  }

  * {
    box-sizing: border-box;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    padding: 40px 24px 64px;
  }

  header {
    max-width: 1180px;
    margin: 0 auto 32px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px 24px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }
  h1 {
    font-family: "Press Start 2P", "IBM Plex Mono", monospace;
    font-size: 15px;
    line-height: 1.6;
    letter-spacing: 0.5px;
    margin: 0;
    text-wrap: balance;
  }
  header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 12.5px;
  }

  main {
    max-width: 1180px;
    margin: 0 auto;
  }

  section + section {
    margin-top: 36px;
  }

  .species-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0 0 14px;
  }
  .species-head h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    margin: 0;
    font-weight: 600;
  }
  .species-head .count {
    font-size: 11.5px;
    color: var(--text-faint);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 14px 12px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .portrait {
    width: 96px;
    height: 96px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    margin-bottom: 10px;
  }
  canvas {
    image-rendering: pixelated;
  }

  .card strong {
    font-size: 12.5px;
    font-weight: 600;
  }
  .card .breed {
    font-size: 10.5px;
    color: var(--text-muted);
    margin-top: 3px;
  }
  .card .id {
    font-size: 9.5px;
    color: var(--text-faint);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .swatches {
    display: flex;
    gap: 3px;
    margin-top: 8px;
  }
  .swatches span {
    width: 10px;
    height: 10px;
    border: 1px solid var(--border);
    display: block;
  }
  .lock-tag {
    margin-top: 8px;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--lock);
    border: 1px solid var(--lock);
    padding: 2px 6px;
  }

  footer {
    max-width: 1180px;
    margin: 40px auto 0;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    color: var(--text-faint);
    font-size: 11px;
  }
</style>

  // packages/pet/src/procedural-renderer.ts 를 그대로 이식
  function plotPet(pet, plot) {
    const dark = "#31313a";
    const light = pet.secondary;
    const isCat = pet.species === "cat";

    if (pet.species === "rabbit") {
      plot(5, 0, 2, 6, pet.body);
      plot(10, 0, 2, 6, pet.body);
      plot(6, 1, 1, 4, pet.secondary);
      plot(10, 1, 1, 4, pet.secondary);
    }

    plot(5, 4, 7, 6, pet.body);
    plot(4, 9, 9, 6, pet.body);
    plot(5, 14, 3, 2, pet.body);
    plot(10, 14, 3, 2, pet.body);

    if (pet.species === "rabbit") {
      // 긴 귀는 몸통보다 먼저 그려 위쪽 실루엣을 유지
    } else if (pet.ear === "point") {
      plot(5, 2, 2, 3, pet.body);
      plot(10, 2, 2, 3, pet.body);
      plot(5, 2, 1, 1, light);
      plot(11, 2, 1, 1, light);
    } else if (pet.ear === "floppy") {
      plot(3, 4, 3, 5, pet.secondary);
      plot(11, 4, 3, 5, pet.secondary);
    } else {
      plot(4, 3, 3, 3, pet.body);
      plot(10, 3, 3, 3, pet.body);
    }

    if (pet.species === "rabbit") {
      plot(12, 11, 3, 3, pet.secondary);
    } else if (pet.species === "capybara") {
      plot(12, 10, 4, 3, pet.body);
      plot(13, 9, 3, 2, pet.body);
      plot(14, 11, 1, 1, dark);
      plot(7, 1, 3, 2, pet.accent);
      plot(8, 0, 2, 1, pet.accent);
    } else if (pet.species === "quokka") {
      plot(12, 10, 3, 3, pet.body);
      plot(13, 9, 2, 2, pet.body);
    } else if (isCat) {
      plot(13, 10, 2, 2, pet.body);
      plot(14, 8, 2, 3, pet.body);
    } else {
      plot(12, 10, 3, 2, pet.body);
      plot(14, 9, 2, 2, pet.body);
    }

    if (pet.pattern === "spots" || pet.pattern === "patches") {
      plot(6, 4, 2, 2, pet.secondary);
      plot(10, 10, 2, 3, pet.secondary);
      if (pet.pattern === "spots") plot(6, 12, 1, 1, pet.secondary);
    }
    if (pet.pattern === "stripes") {
      plot(6, 4, 1, 2, pet.secondary);
      plot(8, 3, 1, 2, pet.secondary);
      plot(10, 4, 1, 2, pet.secondary);
      plot(5, 10, 2, 1, pet.secondary);
      plot(10, 12, 2, 1, pet.secondary);
    }
    if (pet.pattern === "mask") {
      plot(5, 4, 3, 3, pet.secondary);
      plot(9, 4, 3, 3, pet.secondary);
    }
    if (pet.pattern === "tuxedo") {
      plot(7, 7, 3, 6, light);
      plot(6, 13, 5, 2, light);
    }
    if (pet.pattern === "points") {
      plot(7, 7, 3, 2, light);
      plot(5, 14, 2, 1, light);
      plot(11, 14, 2, 1, light);
    }
    if (pet.pattern === "blaze") {
      plot(8, 4, 2, 5, light);
      plot(7, 11, 3, 3, light);
    }

    plot(6, 6, 1, 1, dark);
    plot(10, 6, 1, 1, dark);
    plot(8, 8, 2, 1, dark);
    plot(6, 9, 1, 1, isCat ? dark : pet.body);
    plot(10, 9, 1, 1, isCat ? dark : pet.body);

    if (pet.species === "rabbit") {
      plot(4, 8, 2, 1, "#ef8f9d");
      plot(11, 8, 2, 1, "#ef8f9d");
    }

    if (pet.species === "quokka") {
      plot(7, 9, 1, 1, dark);
      plot(9, 9, 1, 1, dark);
      plot(8, 10, 1, 1, dark);
    }

    for (const accessory of pet.accessories) {
      if (accessory === "collar") plot(5, 9, 7, 1, pet.accent);
      if (accessory === "tag") plot(8, 10, 2, 2, pet.accent);
      if (accessory === "scarf") {
        plot(4, 9, 9, 2, pet.accent);
        plot(10, 11, 2, 3, pet.accent);
      }
      if (accessory === "bow") {
        plot(5, 9, 3, 2, pet.accent);
        plot(10, 9, 3, 2, pet.accent);
        plot(8, 9, 2, 2, "#f2c65c");
      }
      if (accessory === "glasses") {
        plot(5, 5, 3, 2, dark);
        plot(9, 5, 3, 2, dark);
        plot(8, 5, 1, 1, dark);
        plot(6, 6, 1, 1, "#d8eff1");
        plot(10, 6, 1, 1, "#d8eff1");
      }
      if (accessory === "bandana") {
        plot(5, 9, 7, 2, pet.accent);
        plot(7, 11, 4, 2, pet.accent);
      }
      if (accessory === "crown") {
        plot(6, 1, 6, 2, pet.accent);
        plot(6, 0, 1, 2, pet.accent);
        plot(9, 0, 1, 2, pet.accent);
        plot(11, 0, 1, 2, pet.accent);
      }
      if (accessory === "flower") {
        plot(11, 3, 1, 3, pet.accent);
        plot(10, 4, 3, 1, pet.accent);
        plot(11, 4, 1, 1, "#f6d15f");
      }
    }
  }

  function renderCard(pet) {
    const isMissionPet = !!pet.unlock;
    const card = document.createElement("div");
    card.className = "card";

    const portrait = document.createElement("div");
    portrait.className = "portrait";
    const canvas = document.createElement("canvas");
    canvas.width = 54;
    canvas.height = 54;
    canvas.style.width = "72px";
    canvas.style.height = "72px";
    portrait.appendChild(canvas);

    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    const scale = 3;
    plotPet(pet, (x, y, w, h, color) => {
      ctx.fillStyle = color;
      ctx.fillRect((x + 1) * scale, (y + 1) * scale, w * scale, h * scale);
    });

    const name = document.createElement("strong");
    name.textContent = pet.name;
    const breed = document.createElement("div");
    breed.className = "breed";
    breed.textContent = pet.breed;
    const id = document.createElement("div");
    id.className = "id";
    id.textContent = pet.id;

    const swatches = document.createElement("div");
    swatches.className = "swatches";
    [pet.body, pet.secondary, pet.accent].forEach((c) => {
      const sw = document.createElement("span");
      sw.style.background = c;
      swatches.appendChild(sw);
    });

    card.append(portrait, name, breed, id, swatches);

    if (isMissionPet) {
      const tag = document.createElement("div");
      tag.className = "lock-tag";
      tag.textContent = "미션 해금형";
      tag.title = pet.unlock.mission;
      card.appendChild(tag);
    }

    return card;
  }

  const bySpecies = new Map();
  for (const pet of PETS) {
    if (!bySpecies.has(pet.species)) bySpecies.set(pet.species, []);
    bySpecies.get(pet.species).push(pet);
  }

  const speciesLabel = {
    dog: "Dog · 개",
    cat: "Cat · 고양이",
    rabbit: "Rabbit · 토끼",
    capybara: "Capybara · 카피바라",
    quokka: "Quokka · 쿼카",
  };

  const main = document.getElementById("main");
  for (const [species, pets] of bySpecies) {
    const section = document.createElement("section");
    const head = document.createElement("div");
    head.className = "species-head";
    const h2 = document.createElement("h2");
    h2.textContent = speciesLabel[species] ?? species;
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = pets.length + "종";
    head.append(h2, count);

    const grid = document.createElement("div");
    grid.className = "grid";
    pets.forEach((pet) => grid.appendChild(renderCard(pet)));

    section.append(head, grid);
    main.appendChild(section);
  }

  document.getElementById("summary").textContent =
    PETS.length + "종 (해금형 " + PETS.filter((p) => p.unlock).length + "종 포함)";
</script>
